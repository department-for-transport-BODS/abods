}

type InvitationType {
  accepted: Boolean!
  email: String!
  organisation: OrganisationType
  role: RoleType
}

input InvitationInput {
  email: String!
  organisation: OrganisationReferenceInput
  role: RoleReferenceInput!
}

input OrganisationReferenceInput {
    id: String!
}

input RoleReferenceInput {
    id: String!
}

input AlertReferenceInput {
    id: String!
}

input AlertInputType {
  alertType: AlertTypeEnum
  sendTo: AlertReferenceInput!
  eventHysterisis: Int
  eventThreshold: Int
}


type AlertType {
    alertId: String!
    alertType: AlertTypeEnum
    createdBy: UserType
    eventHysterisis: Int
    eventThreshold: Int
    sendTo: UserType
}

enum AlertTypeEnum {
    FeedComplianceFailure
    FeedFailure
    VehicleCountDisparity
}

type ApiInfoType {
    buildNumber: String
    version: String
