}

type OrganisationType{
    id: String!
    name: String!
}

type RoleType {
    id: String!
    name: String!
    scope: String!
}

enum ScopeEnum{
    organisation,
    system
}

type OnTimePerformanceType {
  delayFrequency(inputs: PerformanceInputType!): [DelayFrequencyType]
  journeyScheduledStartTimes: [JourneyScheduledStartTimes]
  operatorPerformance(inputs: PerformanceInputType!): OperatorPerformancePage
  punctualityDayOfWeek(inputs: PerformanceInputType!): [PunctualityDayOfWeekType]
  punctualityOverview(inputs: PerformanceInputType!): PunctualityTotalsType
  punctualityTimeOfDay(inputs: PerformanceInputType!): [PunctualityTimeOfDayType]
  punctualityTimeSeries(inputs: PerformanceInputType!): [PunctualityTimeSeriesType]
  servicePerformance(inputs: PerformanceInputType!): [ServicePerformanceType]
  servicePunctuality: [ServicePunctualityType]
  stopPerformance(inputs: PerformanceInputType!): [StopPerformanceType]
}

