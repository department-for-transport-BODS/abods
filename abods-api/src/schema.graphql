scalar DateTime
scalar Time
scalar Date

type Query {
    user(id: String): UserType
    users:[UserType]
    apiInfo: ApiInfoType
    roles: [RoleType]
    userAlerts: [AlertType]
    userAlert(alertId: String!): AlertType
    operator(operatorId: String!, lineId: String!): OperatorType
    operators: OperatorsPage
    adminAreas(adminAreaIds: [String!]): [AdminAreasType]
    onTimePerformance: OnTimePerformanceType
    headwayMetrics: HeadwayMetricsType
    serviceInfo(serviceId: String!): ServiceInfoType
}

type Mutation {
    login(username: String!, password: String!): LoginResponse
    logout: Boolean!
    addUserAlert(payload: AlertInputType!): MutationResponseType!
    updateUserAlert(alertId: String!, payload: AlertInputType!): MutationResponseType!
    deleteUserAlert(alertId: String!): MutationResponseType!
}

type HeadwayMetricsType {
  frequentServices(operatorId: String!, fromTimestamp: DateTime!, toTimestamp: DateTime!): [FrequentServiceType]
  frequentServiceInfo(inputs: FrequentServiceInfoInputType): FrequentServiceInfoType
  headwayDayOfWeek(lineId: String!): [HeadwayDayOfWeekType]
  headwayOverview(inputs: HeadwayInputType!): HeadwayOverviewType
  headwayTimeOfDay(lineId: String!): [HeadwayTimeOfDayType]
  headwayTimeSeries(inputs: HeadwayInputType!): [HeadwayTimeSeriesType]
}

input HeadwayInputType {
  filters: HeadwayFiltersInputType
  fromTimestamp: DateTime
  toTimestamp: DateTime
  sortBy: HeadwaySortType
}

enum HeadwaySortEnum {
  ActualWaitTime
  ExcessWaitTime
  ScheduledWaitTime
}

input HeadwaySortType {
    field: HeadwaySortEnum
    order: SortOrderEnum
}

input HeadwayFiltersInputType {
  dayOfWeekFlags: DayOfWeekFlagsInputType
  endTime: Time
  granularity: Granularity
  lineIds: [String]
  nocCodes: [String]
  operatorIds: [String]
  startTime: Time
}

input DayOfWeekFlagsInputType {
  friday: Boolean
  monday: Boolean
  saturday: Boolean
  sunday: Boolean
  thursday: Boolean
  tuesday: Boolean
  wednesday: Boolean
}

input FrequentServiceInfoInputType {
  filters: FrequentServiceInfoFilterType
  fromTimestamp: DateTime!
  toTimestamp: DateTime!
}

input FrequentServiceInfoFilterType {
  dayOfWeekFlags: DayOfWeekFlagsInputType
  endTime: Time
  lineId: String
  noc: String
  operatorId: String
  startTime: Time
}



type FrequentServiceType {
  serviceId: String
  serviceInfo: ServiceInfoType
}

type FrequentServiceInfoType {
  numHours: Int
  totalHours: Int
}

type HeadwayDayOfWeekType {
  dayOfWeek: Int
  actualWaitTime: Float
  excessWaitTime: Float
  scheduledWaitTime: Float
}

type HeadwayOverviewType {
  actualWaitTime: Float
  excessWaitTime: Float
  scheduledWaitTime: Float
}

type HeadwayTimeOfDayType {
  timeOfDay: Time
  actualWaitTime: Float
  excessWaitTime: Float
  scheduledWaitTime: Float
}

type HeadwayTimeSeriesType {
  ts: DateTime
  actualWaitTime: Float
  excessWaitTime: Float
  scheduledWaitTime: Float
}

type TransitModelType {
  lines(filterBy: LineFilterType): PaginatedLineType
}

input LineFilterType {
  lineIds: [String!]
}

type PaginatedLineType {
  items: [LineType]
}

type LineType {
  lineId: String
  lineName: String
  servicePatterns: [ServicePatternType]
}

type ServicePatternType {
  servicePatternId: String
  name: String
  stops: [StopType]
  serviceLinks: [ServiceLinkType]
}

type StopType {
  stopId: String
  stopName: String
  lon: Float
  lat: Float
}

type ServiceLinkType {
  fromStop: String
  toStop: String
  distance: Int
  routeValidity: String
  linkRoute: String
}


type AdminAreasType {
    adminAreaId: String!
    adminAreaName: String!
    shape: String!
}

type OperatorsPage {
    pageInfo: PageInfo
    items: [OperatorType]
}

type OperatorType {
    name: String
    nocCode: String
    operatorId: String
    adminAreas: [AdminAreaInfoType]
    transitModel: TransitModelType
}

type AdminAreaInfoType {
    adminAreaId: String
}

input UserUpdateInput {
    firstName: String!
    lastName: String!
