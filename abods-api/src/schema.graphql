enum ShortCodeDayOfWeek {
  Fri
  Mon
  Sat
  Sun
  Thu
  Tue
  Wed
}

input PerformanceInputType {
  filters: PerformanceFiltersInputType
  fromTimestamp: DateTime!
  paging: PagingInputType
  sortBy: PunctualitySortType
  toTimestamp: DateTime!
}

input PerformanceFiltersInputType {
  addNonTagged: Boolean
  adminAreaIds: [String]
  dayOfWeekFlags: DayOfWeekFlagsInputType
  endTime: String
  excludedDates: [Date]
  excludeItoLineId: String
  granularity: Granularity
  lineDirection: LineDirection
  lineIds: [String]
  maxDelay: Int
  minDelay: Int
  nocCodes: [String]
  onTimeMaxMinutes: Int
  onTimeMinMinutes: Int
  operatorIds: [String]
  startTime: String
  startTimes: [Time]
  stopsSegment: StopsSegment
  tagIds: [Int]
  timingPointsOnly: Boolean
}

enum Granularity {
  day
  hour
  minute
  month
}

enum LineDirection {
  All
  Inbound
  Outbound
}

enum StopsSegment {
  First
  Intermediate
}


input PagingInputType {
  after: Int
  first: Int
}

input PunctualitySortType {
  field: PunctualitySortEnum
  order: SortOrderEnum
}

enum PunctualitySortEnum {
  Early
  Late
  OnTime
}

enum SortOrderEnum {
  ASC
  DESC
}
