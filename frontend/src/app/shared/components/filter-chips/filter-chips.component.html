<ul
  *ngIf="enableChip || isDayOfWeek || isTimeRange || isMinDelay || isMaxDelay"
  class="filter-chips"
>
  <ng-content></ng-content>
  <li *ngIf="isDayOfWeek" class="filter-chips__item">
    <app-chip
      [label]="'Day of the week'"
      [value]="dayOfWeekValues"
      (closeChip)="onClearDayOfWeekFilter()"
    ></app-chip>
  </li>
  <li *ngIf="isTimeRange" class="filter-chips__item">
    <app-chip
      [label]="'Time range'"
      [value]="timeRange"
      (closeChip)="onClearTimeRangeFilter()"
    ></app-chip>
  </li>
  <li *ngIf="isMinDelay" class="filter-chips__item">
    <app-chip
      [label]="'Maximum early'"
      [value]="minDelay"
      (closeChip)="onClearMinDelayFilter()"
    ></app-chip>
  </li>
  <li *ngIf="isMaxDelay" class="filter-chips__item">
    <app-chip
      [label]="'Maximum late'"
      [value]="maxDelay"
      (closeChip)="onClearMaxDelayFilter()"
    ></app-chip>
  </li>
</ul>
