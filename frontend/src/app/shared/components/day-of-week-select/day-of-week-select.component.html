<gds-checkboxes
  size="small"
  layout="horizontal"
  legend="Day of the week"
  legendSize="s"
  [error]="error"
>
  <gds-checkboxes-item
    *ngFor="let day of daysOfWeek"
    [inputId]="day.key"
    [name]="'days'"
    [label]="day.label"
    [value]="day.key"
    [checked]="value[day.key]"
    (checkedChange)="toggle(day.key, $event)"
  />
</gds-checkboxes>
