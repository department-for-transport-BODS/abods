query operatorList {
  operators {
    items {
      name
      nocCode
      operatorId
      adminAreas {
        adminAreaId
      }
    }
  }
}

query operatorLines(
  $operatorIds: [String!]!
  $inputDate: String!
  $endDate: String
) {
  lines(operatorIds: $operatorIds, inputDate: $inputDate, endDate: $endDate) {
    id
    name
    number
  }
}
