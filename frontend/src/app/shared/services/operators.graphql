query operatorList {
  operators {
    name
    nocCode
    operatorId
    adminAreaIds
  }
}

query operatorLines(
  $operatorIds: [String!]!
  $inputDate: String!
  $endDate: String
) {
  lines(operatorIds: $operatorIds, inputDate: $inputDate, endDate: $endDate) {
    id
    name
    number
  }
}
