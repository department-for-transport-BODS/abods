query operatorList {
  operators {
    items {
      name
      nocCode
      operatorId
      adminAreas {
        adminAreaId
      }
    }
  }
}

query operatorLines($operatorId: String!, $inputDate: DateTime) {
  operator(operatorId: $operatorId) {
    transitModel {
      lines(filterBy: {inputDate: $inputDate}) {
        items {
          id: lineId
          name: lineName
          number: lineNumber
        }
      }
    }
  }
}
