query operatorList {
  operators {
    items {
      name
      nocCode
      operatorId
      adminAreas {
        adminAreaId
      }
    }
  }
}

query operatorLines($operatorId: String!, $inputDate: String) {
  lines(operatorId: $operatorId, inputDate: $inputDate) {
    id
    name
    number
  }
}
