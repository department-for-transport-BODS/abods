<app-box>
  <h2 class="govuk-heading-m">Feed status</h2>
  <table class="feed-status-summary">
    <thead>
      <tr>
        <th class="feed-status-summary__heading">
          <span class="govuk-visually-hidden">Status</span>
        </th>
        <th class="feed-status-summary__heading">
          <span class="govuk-visually-hidden">Operators</span>
        </th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let operator of operators">
        <td class="feed-status-summary__status">
          <app-status
            [active]="operator.feedMonitoring?.feedStatus ?? false"
            size="small"
            [label]="false"
          ></app-status>
        </td>
        <td class="feed-status-summary__operator">
          <app-tooltip [message]="operator.operatorId" [selectable]="true">{{
            operator.name
          }}</app-tooltip>
        </td>
      </tr>
    </tbody>
  </table>
  <div class="feed-status-summary__footer">
    <app-link
      [route]="['/feed-monitoring/']"
      weight="bold"
      [arrows]="true"
      [underline]="false"
      >NOC feed monitoring</app-link
    >
  </div>
</app-box>
