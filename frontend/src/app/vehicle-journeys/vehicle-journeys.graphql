query avls($groupId: String!) {
  avls(groupId: $groupId) {
    recordedAtTimeUtc
    latitude
    longitude
    vehicleRef
  }
}

query route($groupId: String!) {
  route(groupId: $groupId) {
    estimatedDepartureUtc
    actualDepartureUtc
    scheduledDepartureUtc
    latitude
    longitude
    stopIndex
    stopName
    stopId
    isTimingPoint
    operatorName
    operatorNoc
    lineName
    serviceId
    serviceName
    startTime
    otp
    otpEstimate
  }
}

query journeys(
  $fromTimestamp: DateTime!
  $toTimestamp: DateTime!
  $lineId: String!
  $filterOnStartTime: Boolean!
) {
  vehicleReplay {
    findJourneys(
      inputs: {
        fromTimestamp: $fromTimestamp
        toTimestamp: $toTimestamp
        filters: { lineIds: [$lineId], filterOnStartTime: $filterOnStartTime }
      }
    ) {
      groupId
      startTime
      serviceInfo {
        serviceName
        serviceNumber
      }
    }
  }
}
