<div
  class="stop-list-item"
  [ngClass]="{
    'stop-list-item--timing-point': stop?.isTimingPoint,
    'stop-list-item--timing-point--first': stop?.isTimingPoint && firstItem
  }"
>
  <div class="stop-list-item__value-container">
    <span
      *ngIf="!stop?.isHidden"
      [ngxTippy]="stop?.isTimingPoint ? 'Timing point' : null"
      [tippyProps]="{ theme: 'gds-tooltip' }"
    >
      <svg-icon
        class="stop-list-item__icon"
        [ngClass]="{
          'stop-list-item__icon--on-time': (stop?.onTimePerformance?.toString()) === 'OnTime',
          'stop-list-item__icon--early': (stop?.onTimePerformance?.toString()) === 'Early',
          'stop-list-item__icon--late': (stop?.onTimePerformance?.toString()) === 'Late',
          'stop-list-item__icon--no-data': (stop?.onTimePerformance ?? null) === null,
          'stop-list-item__icon--stop': !stop?.isTimingPoint
        }"
        [applyClass]="true"
        [src]="stop?.isTimingPoint ? 'assets/icons/timing.svg' : 'assets/icons/stop.svg'"
        aria-hidden="true"
      ></svg-icon>
      <span class="govuk-visually-hidden">Timing point</span>
    </span>
  </div>
  <div class="stop-list-item__value-container">
    <button
      role="button"
      class="stop-list-item__name unbuttoned"
      (click)="stopSelected.emit(stop)"
      (mouseenter)="stopHovered.emit({ stop: stop, event: 'enter' })"
      (mouseleave)="stopHovered.emit({ stop: stop, event: 'leave' })"
    >
      <span>{{ stop?.stopName ? stop?.stopName : '-' }}</span>
    </button>
  </div>
  <div class="stop-list-item__value-container stop-list-item__value-container__align-right">
    <div *ngIf="!stop?.isHidden" class="stop-list-item__scheduled">
      <div class="stop-list-item__time-container">
        <span
          class="stop-list-item__time-container--minutes">{{ stop?.scheduledDeparture | dateTimeToFormat: 'HH:mm' }}</span>
        <span
          class="stop-list-item__time-container--seconds">:{{ stop?.scheduledDeparture | dateTimeToFormat: 'ss' }}</span>
      </div>
    </div>
  </div>
  <div class="stop-list-item__value-container stop-list-item__value-container__align-right">
    <span *ngIf="!stop?.isHidden" class="stop-list-item__actual">
      <div *ngIf="stop?.actualDeparture; else empty"
           [ngxTippy]="'Calculated delay ' + (stop?.delay | formatDuration: 'mm:ss':'+')"
           [tippyProps]="{ theme: 'gds-tooltip' }"
           class="stop-list-item__time-container">
        <span
          class="stop-list-item__time-container--minutes">{{ stop?.actualDeparture | dateTimeToFormat: 'HH:mm' }}</span>
        <span
          class="stop-list-item__time-container--seconds">:{{ stop?.actualDeparture | dateTimeToFormat: 'ss' }}</span>
      </div>
      <ng-template #empty>-</ng-template>
    </span>
  </div>
</div>
