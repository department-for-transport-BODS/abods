<div class="journey-info govuk-body-m">
  <span>Operator: </span>
  <span>
    <strong>{{ operatorName }} ({{ operatorNocCode }})</strong>
  </span>
  <span> Service pattern: </span>
  <span>
    <strong>{{ servicePatternName }}</strong>
  </span>
  <span>Scheduled start time: </span>
  <span>
    <strong>{{
      startTime?.setZone("Europe/London") | dateTimeToFormat: "d MMM y, HH:mm"
    }}</strong>
  </span>
  <span>Vehicle ID: </span>
  <span>
    <strong>{{ vehicleId }}</strong>
  </span>
</div>
