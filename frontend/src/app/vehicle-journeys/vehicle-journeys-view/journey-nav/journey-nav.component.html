<div class="journey-nav">
  <span>Journey</span>
  <ng-container *ngIf="!loading; else skeleton">
    <a
      class="journey-nav__link"
      [class.journey-nav__link--disabled]="!previous"
      [routerLink]="previous ? ['/vehicle-journeys', previous.groupId] : null"
      [queryParams]="{ startTime: previous?.startTime }"
      queryParamsHandling="merge"
      [ngxTippy]="prevTooltip"
      [tippyProps]="tippyProps"
    >
      <svg-icon
        class="journey-nav__icon"
        src="assets/icons/caret-left.svg"
        [applyClass]="true"
      ></svg-icon>
      <div #prevTooltip>
        {{ previous?.serviceNumber }}: {{ previous?.serviceName }}
      </div>
      <span *ngIf="previous">{{ formatStartTime(previous) }}</span>
    </a>

    <a
      class="journey-nav__link"
      [class.journey-nav__link--disabled]="!next"
      [routerLink]="next ? ['/vehicle-journeys', next.groupId] : null"
      [queryParams]="{ startTime: next?.startTime }"
      queryParamsHandling="merge"
      [ngxTippy]="nextTooltip"
      [tippyProps]="tippyProps"
    >
      <div #nextTooltip>{{ next?.serviceNumber }}: {{ next?.serviceName }}</div>
      <span *ngIf="next">{{ formatStartTime(next) }}</span>
      <svg-icon
        class="journey-nav__icon"
        src="assets/icons/caret-right.svg"
        [applyClass]="true"
      ></svg-icon>
    </a>
  </ng-container>
  <ng-template #skeleton
    ><app-skeleton
      class="govuk-!-margin-left-2"
      appearance="body"
      width="150px"
    ></app-skeleton
  ></ng-template>
</div>
