<app-page>
  <ng-container ngProjectAs="content"
    ><app-page-header
      heading="Data monitoring"
      spaceAbove="2"
      spaceBelow="2"
    ></app-page-header>

      *ngIf="loading"
      [vCentre]="true"
      message="Loading..."
      size="default"
    ></app-spinner>
    <div id="dashboardContainer"></div>
  </ng-container>
</app-page>
