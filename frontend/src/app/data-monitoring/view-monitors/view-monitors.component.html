<app-page>
  <ng-container ngProjectAs="content"
    ><app-page-header
      heading="Data monitoring"
      spaceAbove="2"
      spaceBelow="2"
    ></app-page-header>
    <br />
    <gds-button
      text="Enable dashboard"
      appearance="secondary"
      (click)="onButtonClick()"
      [attr.tabindex]="null"
    ></gds-button>
    <app-spinner
      *ngIf="loading"
      [vCentre]="true"
      message="Loading..."
      size="default"
    ></app-spinner>
    <div id="dashboardContainer"></div>
  </ng-container>
</app-page>
