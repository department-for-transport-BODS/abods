<app-filter-chips
  [enableChip]="adminAreas.length > 0"
  [filters]="filters"
  (filterChange)="updateFilters($event)"
>
  <ng-container *ngIf="showAdminAreas">
    <li *ngFor="let adminArea of adminAreas" class="filter-chips__item">
      <app-chip
        label="Area"
        [value]="adminArea.name"
        (closeChip)="clearAdminAreaFilter(adminArea.id)"
      ></app-chip>
    </li>
  </ng-container>
</app-filter-chips>
