<div class="user-account">
  <a
    href="https://publish.bus-data.dft.gov.uk/account/manage/invite/"
    target="_blank"
  >
    <button class="user-account__invite-button button-link">
      <div>
        <svg-icon src="assets/icons/plus.svg"> </svg-icon>
      </div>
      <span>Invite a new user</span>
    </button>
  </a>

  <app-popover
    position="right-end"
    identifier="user-account-menu"
    triggerLabel="My account"
    triggerIcon="user"
    triggerType="link"
  >
    <ul app-actionlist>
      <li app-actionlist-action route="my-account" style="display: none">
        My account
      </li>
      <li app-actionlist-section title="My organisation" style="display: none">
        <ul class="govuk-list govuk-!-margin-bottom-0">
          <!-- <li app-actionlist-action [disabled]="true" route="organisation-settings">Organisation settings</li> -->
          <li
            app-actionlist-action
            [route]="['/organisation', 'alerts']"
            (click)="tippyService.hide('user-account-menu')"
          >
            Notifications
          </li>
        </ul>
      </li>
      <li app-actionlist-action (onClick)="logout($event)">Logout</li>
    </ul>
  </app-popover>
</div>
