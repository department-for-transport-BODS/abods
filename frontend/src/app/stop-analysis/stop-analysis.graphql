query stopAnalysis(
  $adminAreaIds: [String!]!
  $boundingBox: BoundingBoxInputType!
  $fromTimestamp: String!
  $lineIds: [String!]!
  $matchType: MatchType!
  $operatorIds: [String!]!
  $toTimestamp: String!
  $dayOfWeekFlags: DayOfWeekFlagsInputType!
) {
  stopAnalysis(
    inputs: {
      adminAreaIds: $adminAreaIds
      boundingBox: $boundingBox
      fromTimestamp: $fromTimestamp
      lineIds: $lineIds
      matchType: $matchType
      operatorIds: $operatorIds
      toTimestamp: $toTimestamp
      dayOfWeekFlags: $dayOfWeekFlags
    }
  ) {
    stopId
    atcoCode
    stopName
    localityName
    adminAreaName
    timingPoint
    latitude
    longitude
    early
    late
    onTime
    scheduledDepartures
    completedDepartures
    totalDelay
  }
}
