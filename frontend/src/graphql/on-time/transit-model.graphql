query transitModelServicePatternStops($operatorId: String!, $lineId: String!) {
  servicePatterns(operatorId: $operatorId, lineId: $lineId) {
    servicePatternId
    stops {
      stopId
      stopName
      lon
      lat
    }
    serviceLinks {
      fromStop
      toStop
      distance
      routeValidity
      linkRoute
    }
  }
}
