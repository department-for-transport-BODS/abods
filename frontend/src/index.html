<!doctype html>
<html lang="en" class="govuk-template--rebranded">
  <head>
    <meta charset="utf-8" />
    <title>Analyse Bus Open Data</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="shortcut icon"
      sizes="16x16 32x32 48x48"
      href="/assets/rebrand/images/favicon.ico"
      type="image/x-icon"
    />
    <meta name="theme-color" content="#1d70b8" />
    <link rel="icon" sizes="48x48" href="/assets/rebrand/images/favicon.ico" />
    <link
      rel="icon"
      sizes="any"
      href="/assets/rebrand/images/favicon.svg"
      type="image/svg+xml"
    />
    <link
      rel="mask-icon"
      href="/assets/rebrand/images/govuk-icon-mask.svg"
      color="#1d70b8"
    />
    <link
      rel="apple-touch-icon"
      href="/assets/rebrand/images/govuk-icon-180.png"
    />
    <link rel="manifest" href="/assets/rebrand/manifest.json" />
    <meta
      property="og:image"
      content="/assets/rebrand/images/govuk-opengraph-image.png"
    />
  </head>

  <body class="govuk-template__body">
    <script>
      document.body.className +=
        " js-enabled" +
        ("noModule" in HTMLScriptElement.prototype
          ? " govuk-frontend-supported"
          : "");
    </script>
    <app-root>
      <div class="spinner spinner--vcentre">
        <svg
          class="spinner__icon"
          width="50px"
          height="50px"
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
        >
          <g fill="none" fillRule="evenodd">
            <circle
              cx="4"
              cy="12"
              r="2.5"
              fill="currentColor"
              class="spinner__dot1"
            />
            <circle
              cx="12"
              cy="12"
              r="2.5"
              fill="currentColor"
              class="spinner__dot2"
            />
            <circle
              cx="20"
              cy="12"
              r="2.5"
              fill="currentColor"
              class="spinner__dot3"
            />
          </g>
        </svg>
        <span class="spinner__message" role="alert" aria-busy="true"
          >Loading &hellip;</span
        >
      </div>
    </app-root>
  </body>
</html>
