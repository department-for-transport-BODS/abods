name: deploy application
run-name:
  deploy application to ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.environment ||
  github.event_name == 'release' && 'prod' ||
  contains(fromJSON('["workflow_dispatch", "push"]'), github.event_name) && (
  startsWith(github.ref, 'refs/tags/v') && 'prod' ||
  github.ref_name == 'main' && 'uat' ||
  github.ref_name == 'test' && 'test' ||
  github.ref_name == 'dev' && 'dev'
  ) || 'sandbox' }}

on:
  workflow_dispatch:
  push:
    branches:
      - "test"
      - "main"
    paths:
      - "VERSION"
  release:
    types: [published]
  repository_dispatch:
    types: [automated-deploy-dev]

concurrency:
  group:
    ${{ github.workflow }}-${{ github.event_name == 'repository_dispatch' && github.event.client_payload.environment ||
    github.event_name == 'release' && 'prod' ||
    startsWith(github.ref, 'refs/tags/v') && 'prod' ||
    github.ref_name == 'main' && 'uat' ||
    github.ref_name == 'test' && 'test' ||
    github.ref_name == 'dev' && 'dev' || 'sandbox' }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  RC_ENV:
    ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.environment ||
    github.event_name == 'release' && 'prod' ||
    contains(fromJSON('["workflow_dispatch", "push"]'), github.event_name) && (
    startsWith(github.ref, 'refs/tags/v') && 'prod' ||
    github.ref_name == 'main' && 'uat' ||
    github.ref_name == 'test' && 'test' ||
    github.ref_name == 'dev' && 'dev'
    ) || 'sandbox' }}
  RC_VER:
    ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.release_version ||
    github.event_name == 'release' && github.event.release.tag_name || 'null' }}
  RC_SRC: ${{ vars.DEPLOYMENT_ARTEFACTS_S3_BUCKET }}

permissions:
  id-token: write

jobs:
  validation:
    runs-on: ubuntu-latest
    environment:
      ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.environment ||
      github.event_name == 'release' && 'prod' ||
      contains(fromJSON('["workflow_dispatch", "push"]'), github.event_name) && (
      startsWith(github.ref, 'refs/tags/v') && 'prod' ||
      github.ref_name == 'main' && 'uat' ||
      github.ref_name == 'test' && 'test' ||
      github.ref_name == 'dev' && 'dev'
      ) || 'sandbox' }}
    outputs:
      AWS_ACCOUNT_ID: ${{ steps.set-vars.outputs.AWS_ACCOUNT_ID }}
      VERSION: ${{ steps.verify.outputs.VERSION }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: checkout
        if: ${{ env.RC_VER == 'null' }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_ASSUME_ROLE_NAME }}
          role-session-name: ${{ vars.PROJECT_NAME }}-${{ env.RC_ENV }}-app-deployment-validation
          role-duration-seconds: 3600
          role-skip-session-tagging: true

      - name: validate job parameters
        id: verify
        run: |
          if [[ ${RC_VER} != 'null' ]]; then
            echo """ \
              Executing deploy job using parameters:
                (Release Version)       - ${RC_VER//\//-}
                (Target Environment)    - $RC_ENV
            """
            echo "VERSION=${RC_VER//\//-}" >> "$GITHUB_OUTPUT"
          else
            current_version=$(yq e '.version' VERSION)

            echo """ \
              Executing deploy job using parameters:
                (Release Version)       - $current_version
                (Target Environment)    - $RC_ENV
            """
            echo "VERSION=${current_version}" >> "$GITHUB_OUTPUT"
          fi

      - name: set environment specific vars
        id: set-vars
        run: |
          echo "AWS_ACCOUNT_ID=${{ vars.AWS_ACCOUNT_ID }}" >> $GITHUB_OUTPUT

      - name: validate release candidate version
        env:
          VERSION: ${{ steps.verify.outputs.VERSION }}
        run: |
          [[ $VERSION =~ ^v[0-9]+(\.[0-9]+){2}$ ]] && rc_path="$RC_SRC/abods/releases/$VERSION" || rc_path="$RC_SRC/abods/releases-dev/$VERSION"

          rc_backend_path="$rc_path/backend"
          rc_frontend_path="$rc_path/frontend-two/$RC_ENV"

          # Application validation
          # Frontend validation
          if [[ `aws s3 ls s3://$rc_frontend_path|head` ]]; then
            echo "[INFO] Release candidate version [${VERSION}] for component (FRONTEND-TWO) successfully validated"
          else
            echo "[ERROR] Release candidate version [${VERSION}] does not exist for component (FRONTEND-TWO). Exiting"
            exit 1
          fi

          # Backend
          if [[ `aws s3 ls s3://$rc_backend_path|head` ]]; then
            echo "[INFO] Release candidate version [${VERSION}] for component (BACKEND) successfully validated"
          else
            echo "[ERROR] Release candidate version [${VERSION}] does not exist for component (BACKEND). Exiting"
            exit 1
          fi

  backend:
    runs-on: ubuntu-latest
    needs: validation
    outputs:
      stack-name: ${{ steps.get-stack.outputs.result }}

    steps:
      - name: setup sam
        uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
        with:
          use-installer: true

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ needs.validation.outputs.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_ASSUME_ROLE_NAME }}
          role-session-name: ${{ vars.PROJECT_NAME }}-${{ env.RC_ENV }}-backend-deployment
          role-duration-seconds: 3600
          role-skip-session-tagging: true

      - name: retrieve backend
        env:
          VERSION: ${{ needs.validation.outputs.VERSION }}
        run: |
          [[ $VERSION =~ ^v[0-9]+(\.[0-9]+){2}$ ]] && rc_path="abods/releases/$VERSION/backend" || rc_path="abods/releases-dev/$VERSION/backend"

          aws s3 cp s3://$RC_SRC/$rc_path/packaged.yaml .
          aws s3 cp s3://$RC_SRC/$rc_path/samconfig.yaml .
          echo "[INFO] Application component (BACKEND) with version ${VERSION} successfully downloaded"

      - name: get stack name
        id: get-stack
        uses: mikefarah/yq@1b9b4ac5187171d2e5e3129be0cfa827c7f9d53d # v4.53.3
        with:
          cmd: yq -r '."${{ env.RC_ENV }}".deploy.parameters.stack_name' samconfig.yaml

      - name: deploy backend for ${{ env.RC_ENV }}
        env:
          VERSION: ${{ needs.validation.outputs.VERSION }}
        run: |
          sam deploy \
            --template-file packaged.yaml \
            --stack-name ${{ steps.get-stack.outputs.result }} \
            --config-env $RC_ENV \
            --region $AWS_REGION \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --s3-bucket $RC_SRC --s3-prefix abods/deployments/$RC_ENV \
            --tags "BuiltFrom=${VERSION} ProjectName=${{ vars.PROJECT_NAME }} Environment=${RC_ENV}"

          echo "[INFO] Application component (BACKEND) with version ${VERSION} successfully deployed into ${RC_ENV^^}"

  frontend-two:
    runs-on: ubuntu-latest
    needs:
      - validation
      - backend

    steps:
      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ needs.validation.outputs.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_ASSUME_ROLE_NAME }}
          role-session-name: ${{ vars.PROJECT_NAME }}-${{ env.RC_ENV }}-frontend-two-deployment
          role-duration-seconds: 3600
          role-skip-session-tagging: true

      - name: retrieve frontend-two for ${{ env.RC_ENV }}
        env:
          VERSION: ${{ needs.validation.outputs.VERSION }}
        run: |
          [[ $VERSION =~ ^v[0-9]+(\.[0-9]+){2}$ ]] && rc_path="abods/releases/$VERSION/frontend-two/$RC_ENV" || rc_path="abods/releases-dev/$VERSION/frontend-two/$RC_ENV"

          mkdir dist/
          aws s3 cp s3://$RC_SRC/$rc_path/ dist/ --recursive
          echo "[INFO] Application component (FRONTEND-TWO) with version ${VERSION} successfully downloaded for ${RC_ENV^^}"

      - name: get stack values
        id: get-values
        run: |
          echo "frontend-bucket-name=$( \
            aws cloudformation describe-stacks \
              --stack-name ${{ needs.backend.outputs.stack-name }} \
              --query 'Stacks[0].Outputs[?OutputKey==`FrontendBucketName`].OutputValue' \
              --output text \
          )" >> $GITHUB_OUTPUT

          echo "cloudfront-distribution-id=$( \
            aws cloudformation describe-stacks \
              --stack-name ${{ needs.backend.outputs.stack-name }} \
              --query 'Stacks[0].Outputs[?OutputKey==`CloudFrontDistributionId`].OutputValue' \
              --output text \
          )" >> $GITHUB_OUTPUT

      - name: clear frontend-two for ${{ env.RC_ENV }}
        run: |
          aws s3 rm --recursive ${{ steps.get-values.outputs.frontend-bucket-name }}
          echo "[INFO] S3 Bucket for application component (FRONTEND-TWO) successfully cleared for ${RC_ENV^^}"

      - name: deploy frontend-two for ${{ env.RC_ENV }}
        env:
          VERSION: ${{ needs.validation.outputs.VERSION }}
        run: |
          aws s3 cp --recursive dist/ ${{ steps.get-values.outputs.frontend-bucket-name }}
          aws s3 cp --recursive ${{ steps.get-values.outputs.frontend-bucket-name }}/freshdesk ${{ steps.get-values.outputs.frontend-bucket-name }}/freshdesk --metadata-directive REPLACE --content-type "text/html; charset=utf-8"
          echo "[INFO] Application component (FRONTEND-TWO) with version ${VERSION} successfully deployed for ${RC_ENV^^}"

      - name: invalidate cloudfront cache for ${{ env.RC_ENV }}
        run: |
          echo "[INFO] Executing invalidation against CloudFront Distribution Id ${{ steps.get-values.outputs.cloudfront-distribution-id }}"
          invalidation_id=$(aws cloudfront create-invalidation --distribution-id ${{ steps.get-values.outputs.cloudfront-distribution-id }} --paths '/*' --output json \
            | jq -r '.Invalidation.Id')

          echo "[INFO] Waiting for invalidation to complete..."
          aws cloudfront wait invalidation-completed --distribution-id ${{ steps.get-values.outputs.cloudfront-distribution-id }} --id $invalidation_id

          if [ $? -eq 0 ]; then
            echo "[INFO] CloudFront cache for application in ${RC_ENV^^} was successfully invalidated"
          elif [ $? -eq 255 ]; then
            echo "[WARN] CloudFront cache for application in ${RC_ENV^^} could not be invalidated"
          fi

  e2e-playwright:
    runs-on: ubuntu-latest
    needs:
      - validation
      - frontend-two
    environment: sandbox
    permissions:
      contents: read
    env:
      CI: "1"
      PLAYWRIGHT_BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL }}
      TEST_USERNAME: ${{ vars.TEST_USERNAME }}
      TEST_PASSWORD: ${{ vars.TEST_PASSWORD }}
      TEST_NOC_CODE: ${{ vars.TEST_NOC_CODE }}

    steps:
      - name: check environment
        id: check-env
        run: |
          if [[ "$RC_ENV" != "sandbox" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "[INFO] Skipping e2e tests — not sandbox"
          fi

      - name: checkout
        if: ${{ steps.check-env.outputs.skip != 'true' }}
        uses: actions/checkout@v4

      - name: setup node
        if: ${{ steps.check-env.outputs.skip != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: validate deployed test url
        if: ${{ steps.check-env.outputs.skip != 'true' }}
        run: |
          if [[ -z "${PLAYWRIGHT_BASE_URL}" ]]; then
            echo "[ERROR] GitHub variable PLAYWRIGHT_BASE_URL is not set for ${RC_ENV^^}."
            exit 1
          fi

          echo "[INFO] Running deployed e2e tests against ${PLAYWRIGHT_BASE_URL}"

      - name: install dependencies
        if: ${{ steps.check-env.outputs.skip != 'true' }}
        run: npm ci --ignore-scripts

      - name: install playwright browser
        if: ${{ steps.check-env.outputs.skip != 'true' }}
        run: npx playwright install --with-deps chromium

      - name: run playwright e2e tests
        if: ${{ steps.check-env.outputs.skip != 'true' }}
        run: npm run test:e2e
