name: pr-checks
on:
  pull_request:
    branches:
      - sandbox

permissions: read-all

jobs:
  formatting-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: "0"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - name: Install
        run: npm i

      - name: Check for changes
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --quiet "$BASE_REF"...HEAD -- frontend; then
            git diff --name-only --exit-code HEAD -- . ':!frontend/package-lock.json' || (echo "It looks like generated files haven't been updated. You can do that by running 'npm install' in the root directory"; false)
          else
            git diff --name-only --exit-code HEAD || (echo "It looks like generated files haven't been updated. You can do that by running 'npm install' in the root directory"; false)
          fi

      - name: Check types
        if: success() || failure()
        run: npm run type-check

      - name: Check formatting
        if: success() || failure()
        run: npm run fmt:check

      - name: Run linters
        if: success() || failure()
        run: npm run lint:check

      - name: Run tests
        if: success() || failure()
        run: npm run test:ci

  build-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: abods-api

    steps:
      - name: checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - name: setup sam
        uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
        with:
          use-installer: true

      - name: build backend code
        run: |
          sam build

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: frontend/.nvmrc

      - name: build frontend code
        run: |
          npm install
          npm run build:production
