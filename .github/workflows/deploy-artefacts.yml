name: deploy artefacts

on:
  # checkov:skip=CKV_GHA_7:Manual deployment selects existing version-matched environment-specific artefacts; this workflow does not build artefacts.
  workflow_dispatch:
    inputs:
      backend_artefact:
        description: Backend prefix in bods-artefact-store
        required: true
        type: string
      frontend_artefact:
        description: Frontend prefix in bods-artefact-store
        required: true
        type: string
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - sandbox
        default: sandbox
  workflow_call:
    inputs:
      backend_artefact:
        description: Backend prefix in bods-artefact-store
        required: true
        type: string
      frontend_artefact:
        description: Frontend prefix in bods-artefact-store
        required: true
        type: string
      environment:
        description: Target environment
        required: true
        type: string
    secrets:
      ARTEFACT_STORE_ROLE_ARN:
        required: true

permissions: {}

concurrency:
  group: abods-artefact-deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ARTEFACT_BUCKET: bods-artefact-store
  ARTEFACT_MANIFEST_TABLE: bods-artefact-manifest

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    outputs:
      version: ${{ steps.inputs.outputs.version }}
    steps:
      - name: validate deployment inputs
        id: inputs
        env:
          BACKEND_ARTEFACT: ${{ inputs.backend_artefact }}
          FRONTEND_ARTEFACT: ${{ inputs.frontend_artefact }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          if [[ -z "$BACKEND_ARTEFACT" || -z "$FRONTEND_ARTEFACT" || -z "$ENVIRONMENT" ]]; then
            echo "::error::Backend artefact, frontend artefact and environment are required"
            exit 1
          fi
          if [[ "$ENVIRONMENT" != "sandbox" ]]; then
            echo "::error::Only the sandbox environment is currently supported"
            exit 1
          fi
          if [[ ! "$BACKEND_ARTEFACT" =~ ^abods_backend_${ENVIRONMENT}_(v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Backend artefact must be abods_backend_${ENVIRONMENT}_vX.Y.Z"
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          if [[ "$FRONTEND_ARTEFACT" != "abods_frontend_${ENVIRONMENT}_${version}" ]]; then
            echo "::error::Frontend artefact must be abods_frontend_${ENVIRONMENT}_${version}, matching the backend version and environment"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: configure aws credentials (artefact repository)
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.ARTEFACT_STORE_ROLE_ARN }}
          role-session-name: abods-deploy-artefacts-validation
          role-skip-session-tagging: true

      - name: validate backend artefact exists
        uses: department-for-transport-BODS/.github/actions/validate-artefact@v1
        with:
          bucket: ${{ env.ARTEFACT_BUCKET }}
          prefix: ${{ inputs.backend_artefact }}
          required_files: |
            packaged.yaml
            samconfig.yaml
            build-info.json

      - name: validate frontend artefact exists
        uses: department-for-transport-BODS/.github/actions/validate-artefact@v1
        with:
          bucket: ${{ env.ARTEFACT_BUCKET }}
          prefix: ${{ inputs.frontend_artefact }}
          required_files: |
            index.html
            config.json
            build-info.json

  deploy:
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      BACKEND_ARTEFACT: ${{ inputs.backend_artefact }}
      FRONTEND_ARTEFACT: ${{ inputs.frontend_artefact }}
      VERSION: ${{ needs.validation.outputs.version }}
      PROJECT_NAME: ${{ vars.PROJECT_NAME }}
      DEPLOYMENT_BUCKET: ${{ vars.DEPLOYMENT_ARTEFACTS_S3_BUCKET }}
    steps:
      - name: setup sam
        uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
        with:
          use-installer: true

      - name: configure aws credentials (artefact repository)
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.ARTEFACT_STORE_ROLE_ARN }}
          role-session-name: abods-${{ env.ENVIRONMENT }}-artefacts-download
          role-skip-session-tagging: true

      - name: download release artefacts
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          aws s3 cp "s3://$ARTEFACT_BUCKET/$BACKEND_ARTEFACT/packaged.yaml" packaged.yaml
          aws s3 cp "s3://$ARTEFACT_BUCKET/$BACKEND_ARTEFACT/samconfig.yaml" samconfig.yaml
          aws s3 cp "s3://$ARTEFACT_BUCKET/$BACKEND_ARTEFACT/build-info.json" backend-build-info.json
          aws s3 cp "s3://$ARTEFACT_BUCKET/$FRONTEND_ARTEFACT/" dist/ --recursive --only-show-errors
          jq -e --arg version "$VERSION" '.version == $version' backend-build-info.json > /dev/null
          jq -e --arg version "$VERSION" --arg environment "$ENVIRONMENT" --arg commit "$(jq -r '.commit' backend-build-info.json)" \
            '.version == $version and .environment == $environment and (.commit | type == "string" and length > 0) and .commit == $commit' dist/build-info.json > /dev/null
          jq -e --arg environment "$ENVIRONMENT" '.envName == $environment' dist/config.json > /dev/null

      - name: configure aws credentials (${{ env.ENVIRONMENT }})
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_ASSUME_ROLE_NAME }}
          role-session-name: abods-${{ env.ENVIRONMENT }}-artefacts-deploy
          role-skip-session-tagging: true

      - name: deploy backend
        id: backend
        uses: department-for-transport-BODS/.github/actions/sam-deploy-artefact@v1
        with:
          template_file: ${{ runner.temp }}/packaged.yaml
          config_file: ${{ runner.temp }}/samconfig.yaml
          config_environment: ${{ env.ENVIRONMENT }}
          aws_region: ${{ env.AWS_REGION }}
          deployment_bucket: ${{ env.DEPLOYMENT_BUCKET }}
          deployment_prefix: abods/deployments/${{ env.ENVIRONMENT }}
          project_name: ${{ env.PROJECT_NAME }}
          release_version: ${{ env.VERSION }}

      - name: get frontend deployment targets
        id: frontend-targets
        working-directory: ${{ runner.temp }}
        env:
          STACK_NAME: ${{ steps.backend.outputs.stack_name }}
        run: |
          set -euo pipefail
          aws cloudformation describe-stacks --stack-name "$STACK_NAME" --output json > stack.json
          frontend_bucket=$(jq -er '.Stacks[0].Outputs[] | select(.OutputKey == "FrontendBucketName") | .OutputValue | select(startswith("s3://"))' stack.json)
          distribution_id=$(jq -er '.Stacks[0].Outputs[] | select(.OutputKey == "CloudFrontDistributionId") | .OutputValue | select(length > 0)' stack.json)
          echo "bucket=$frontend_bucket" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$distribution_id" >> "$GITHUB_OUTPUT"

      - name: deploy frontend and invalidate cache
        uses: department-for-transport-BODS/.github/actions/deploy-static-frontend@v1
        with:
          export_directory: ${{ runner.temp }}/dist
          target_bucket: ${{ steps.frontend-targets.outputs.bucket }}
          cloudfront_distribution_id: ${{ steps.frontend-targets.outputs.distribution_id }}
          html_prefix: freshdesk

      - name: configure aws credentials (artefact manifest)
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          aws-region: eu-west-2
          role-to-assume: ${{ secrets.ARTEFACT_STORE_ROLE_ARN }}
          role-session-name: abods-${{ env.ENVIRONMENT }}-artefacts-manifest
          role-skip-session-tagging: true

      - name: record deployed artefact versions
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          jq -n \
            --arg table "$ARTEFACT_MANIFEST_TABLE" \
            --arg environment "$ENVIRONMENT" \
            --arg backend "$BACKEND_ARTEFACT" \
            --arg frontend "$FRONTEND_ARTEFACT" \
            '{
              TransactItems: ([
                {component: "abods-backend", version: $backend},
                {component: "abods-frontend", version: $frontend}
              ] | map({
                Update: {
                  TableName: $table,
                  Key: {
                    service_artefact: {S: .component},
                    environment: {S: $environment}
                  },
                  UpdateExpression: "SET #version = :version",
                  ExpressionAttributeNames: {"#version": "version"},
                  ExpressionAttributeValues: {":version": {S: .version}}
                }
              }))
            }' > manifest-transaction.json
          aws dynamodb transact-write-items \
            --region eu-west-2 \
            --cli-input-json file://manifest-transaction.json

      - name: report deployment
        run: |
          echo "[INFO] Deployed $VERSION to $ENVIRONMENT"