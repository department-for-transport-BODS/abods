name: Build on CI
on:
  push:
    branches-ignore:
        - main
        - sandbox
        - dev
        - test

permissions: read-all

jobs:
  formatting-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: "0"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - name: Install root dependencies
        run: npm install --ignore-scripts

      - name: Install API dependencies
        run: npm install --prefix abods-api

      - name: Generate code
        run: npm run codegen

      - name: Check for changes
        env:
          BASE_REF: origin/sandbox
        run: |
          if git diff --quiet "$BASE_REF"...HEAD -- frontend-two; then
            git diff --name-only --exit-code HEAD -- . ':!frontend-two/package-lock.json' || (echo "It looks like generated files haven't been updated. You can do that by running 'npm install' in the root directory"; false)
          else
            git diff --name-only --exit-code HEAD || (echo "It looks like generated files haven't been updated. You can do that by running 'npm install' in the root directory"; false)
          fi

      - name: Check types
        if: success() || failure()
        run: npm --prefix abods-api run type-check

      - name: Check formatting
        if: success() || failure()
        run: npm run fmt:check

      - name: Run linters
        if: success() || failure()
        run: npm --prefix abods-api run lint:check

      - name: Run tests
        if: success() || failure()
        run: npm --prefix abods-api run test:ci

  build-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: abods-api

    steps:
      - name: checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - name: setup sam
        uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
        with:
          use-installer: true

      - name: build backend code
        run: |
          sam build

  build-frontend-two:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-two

    steps:
      - name: checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: frontend-two/.nvmrc

      - name: Install
        run: npm install

      - name: Check for changes
        run: git diff --name-only --exit-code HEAD || (echo "It looks like the frontend-two lockfile hasn't been updated. Run 'npm install' in the frontend-two directory using the version in frontend-two/.nvmrc"; false)

      - name: Check types
        if: success() || failure()
        run: npm run typecheck

      - name: Run linters
        if: success() || failure()
        run: npm run lint

      - name: Run tests
        if: success() || failure()
        run: npm run test

      - name: Build frontend-two code
        if: success() || failure()
        run: npm run build

  checkov:
    name: checkov-action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Run Checkov action
        id: checkov
        uses: bridgecrewio/checkov-action@dfb51aed1b783289b0d3f255028e7a88d5e8caa1 # master
        with:
          directory: ${{ github.workspace }}
          framework: all
          skip_check: ""
          output_format: cli,sarif
          quiet: true # display only failed checks