name: build on merge
run-name: build on merge to main @ ${{ github.sha }}

on:
  push:
    branches:
      - "main"
      - "DBODS-1749-build-on-merge"

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ARTEFACT_BUCKET: bods-artefact-store
  ARTEFACT_KMS_KEY_ID: alias/bods-artefact-store
  ARTEFACT_ROLE_ARN: ${{ secrets.AWS_ROLE_TO_ASSUME }}
  TARGET_ENVS: "uat prod"

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      VERSION: ${{ steps.version.outputs.VERSION }}
      ENVIRONMENTS: ${{ steps.version.outputs.ENVIRONMENTS }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: validate artefact repository configuration
        run: |
          if [[ -z "$ARTEFACT_ROLE_ARN" ]]; then
            echo "::error::Missing repository secret: AWS_ROLE_TO_ASSUME"
            exit 1
          fi

      - name: checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: validate version has been updated
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          version=$(yq e '.version' VERSION)
          previous=$(git show "${BEFORE_SHA}:VERSION" | yq e '.version' -)

          if [[ ! $version =~ ^v[0-9]+(\.[0-9]+){2}$ ]]; then
            echo "::error::VERSION '${version}' must be in the format vX.Y.Z"
            exit 1
          fi

          if [[ "$version" == "$previous" ]]; then
            echo "::error::VERSION has not been updated (still ${version}). Bump VERSION before merging to main"
            exit 1
          fi

          if [[ $(printf '%s\n%s\n' "$previous" "$version" | sort -V | tail -n 1) != "$version" ]]; then
            echo "::error::VERSION ${version} must be greater than the previous version ${previous}"
            exit 1
          fi

          echo "[INFO] VERSION updated from ${previous} to ${version}"
          echo "VERSION=${version}" >> "$GITHUB_OUTPUT"
          echo "ENVIRONMENTS=$(jq -cn --arg envs "$TARGET_ENVS" '$envs | split(" ")')" >> "$GITHUB_OUTPUT"

      - name: configure aws credentials (artefact repository)
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.ARTEFACT_ROLE_ARN }}
          role-session-name: ${{ vars.PROJECT_NAME }}-build-on-merge-validation
          role-duration-seconds: 3600
          role-skip-session-tagging: true

      - name: validate version has not already been used
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          for env in $TARGET_ENVS; do
            for prefix in "abods_${env}_${VERSION}" "abods_frontend_${env}_${VERSION}"; do
              count=$(aws s3api list-objects-v2 --bucket "$ARTEFACT_BUCKET" --prefix "${prefix}/" --max-keys 1 --query 'KeyCount' --output text)
              [[ "$count" == "0" ]] && continue

              # A matching commit means this is a re-run of a partially failed build, so overwriting is safe
              built_from=$(aws s3 cp "s3://${ARTEFACT_BUCKET}/${prefix}/build-info.json" - 2>/dev/null | jq -r '.commit // empty' || true)
              if [[ "$built_from" == "$GITHUB_SHA" ]]; then
                echo "[INFO] ${prefix} was started by this commit, allowing re-run"
              else
                echo "::error::Version ${VERSION} has already been used (${prefix} exists). Increment VERSION to build a new release"
                exit 1
              fi
            done
          done

          echo "[INFO] Version ${VERSION} is available for: ${TARGET_ENVS}"

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validation
    defaults:
      run:
        working-directory: abods-api
    env:
      VERSION: ${{ needs.validation.outputs.VERSION }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - name: setup sam
        uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
        with:
          use-installer: true

      - name: build backend
        run: sam build

      - name: configure aws credentials (artefact repository)
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.ARTEFACT_ROLE_ARN }}
          role-session-name: ${{ vars.PROJECT_NAME }}-build-on-merge-backend
          role-duration-seconds: 3600
          role-skip-session-tagging: true

      - name: package and upload backend
        run: |
          jq -n \
            --arg version "$VERSION" \
            --arg commit "$GITHUB_SHA" \
            --arg run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{version: $version, commit: $commit, run: $run}' > build-info.json

          for env in $TARGET_ENVS; do
            prefix="abods_${env}_${VERSION}"

            aws s3 cp build-info.json "s3://${ARTEFACT_BUCKET}/${prefix}/build-info.json" \
              --sse aws:kms --sse-kms-key-id "$ARTEFACT_KMS_KEY_ID"

            sam package \
              --s3-bucket "$ARTEFACT_BUCKET" \
              --s3-prefix "$prefix" \
              --kms-key-id "$ARTEFACT_KMS_KEY_ID" \
              --output-template-file packaged.yaml

            aws s3 cp packaged.yaml "s3://${ARTEFACT_BUCKET}/${prefix}/packaged.yaml" \
              --sse aws:kms --sse-kms-key-id "$ARTEFACT_KMS_KEY_ID"
            aws s3 cp samconfig.yaml "s3://${ARTEFACT_BUCKET}/${prefix}/samconfig.yaml" \
              --sse aws:kms --sse-kms-key-id "$ARTEFACT_KMS_KEY_ID"

            echo "[INFO] Backend ${VERSION} uploaded to s3://${ARTEFACT_BUCKET}/${prefix}/"
          done

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validation
    environment: ${{ matrix.env }}-build
    defaults:
      run:
        working-directory: frontend
    env:
      VERSION: ${{ needs.validation.outputs.VERSION }}

    permissions:
      id-token: write
      contents: read

    strategy:
      matrix:
        env: ${{ fromJSON(needs.validation.outputs.ENVIRONMENTS) }}

    steps:
      - name: checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: frontend/.nvmrc

      - name: configure aws credentials (${{ matrix.env }})
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_ASSUME_ROLE_NAME }}
          role-session-name: ${{ vars.PROJECT_NAME }}-${{ matrix.env }}-build-on-merge-frontend
          role-duration-seconds: 3600
          role-skip-session-tagging: true

      - name: generate frontend config for ${{ matrix.env }}
        env:
          ENVIRONMENT: ${{ matrix.env }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
          MAPBOX_STYLE: mapbox://styles/${{ vars.MAPBOX_STYLE }}
          MAPBOX_SATELLITE_STYLE: mapbox://styles/${{ vars.MAPBOX_SATELLITE_STYLE }}
          ANALYTICS_ID: ${{ secrets.ANALYTICS_ID }}
        run: bash ../scripts/generate-frontend-config.sh

      - name: install dependencies
        run: npm ci

      - name: build frontend for ${{ matrix.env }}
        env:
          CI: ""
          NEXT_GRAPHQL_API_BASE_URL: /api/graphql
        run: npm run build

      - name: configure aws credentials (artefact repository)
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.ARTEFACT_ROLE_ARN }}
          role-session-name: ${{ vars.PROJECT_NAME }}-${{ matrix.env }}-build-on-merge-frontend-upload
          role-duration-seconds: 3600
          role-skip-session-tagging: true

      - name: upload frontend for ${{ matrix.env }}
        env:
          ENVIRONMENT: ${{ matrix.env }}
        run: |
          prefix="abods_frontend_${ENVIRONMENT}_${VERSION}"

          jq -n \
            --arg version "$VERSION" \
            --arg commit "$GITHUB_SHA" \
            --arg environment "$ENVIRONMENT" \
            --arg run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{version: $version, commit: $commit, environment: $environment, run: $run}' > "$RUNNER_TEMP/build-info.json"

          aws s3 cp "$RUNNER_TEMP/build-info.json" "s3://${ARTEFACT_BUCKET}/${prefix}/build-info.json" \
            --sse aws:kms --sse-kms-key-id "$ARTEFACT_KMS_KEY_ID"

          aws s3 sync out/ "s3://${ARTEFACT_BUCKET}/${prefix}/" \
            --exclude "build-info.json" \
            --sse aws:kms --sse-kms-key-id "$ARTEFACT_KMS_KEY_ID" \
            --only-show-errors

          echo "[INFO] Frontend ${VERSION} for ${ENVIRONMENT^^} uploaded to s3://${ARTEFACT_BUCKET}/${prefix}/"
