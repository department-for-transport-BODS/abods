name: Merge deployment pull request

on:
  pull_request_review:
    types: [submitted]

permissions:
  id-token: write

jobs:
  merge-deployment-pr:
    if: github.event.review.state == 'approved' && contains(fromJSON('["dev", "test", "main"]'), github.event.pull_request.base.ref)
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
    - name: Git checkout
      uses: actions/checkout@v2
      with:
        fetch-depth: '0'
    - name: merge
      run: |
        git config --global user.name 'github-actions'
        git config --global user.email 'github-actions@github.com'
        
        git fetch
        git checkout ${{ github.event.pull_request.base.ref }}
        git reset ${{ github.event.pull_request.head.sha }}
        git push

  trigger-deploy-dev:
    runs-on: ubuntu-latest
    needs:
      - merge-deployment-pr

    permissions:
      contents: write

    steps:
      - name: Read VERSION file
        id: get version
        run: echo "::set-output name=version::$(cat VERSION)"
      - name: trigger remote
        uses: peter-evans/repository-dispatch@v3
        with:
          repository: ${{ github.repository }}
          event-type: merge-${{ github.event.pull_request.head.ref }}-to-${{ github.event.pull_request.base.ref }}
          client-payload: '{ "environment": "${{ env.RC_ENV }}", "release_version": "${{ steps.getversion.outputs.version }}" }'
