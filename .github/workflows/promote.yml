name: Promote
run-name: Promote to ${{ inputs.environment }}

on:
  # checkov:skip=CKV_GHA_7:Promotion selects an approved target and deploys existing artefacts without building code.
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - dev
          - test
          - uat

permissions: {}

concurrency:
  group: abods-promotion
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    outputs:
      backend_artefact: ${{ steps.manifest.outputs.backend }}
      frontend_artefact: ${{ steps.manifest.outputs.frontend }}
    steps:
      - name: validate target and select preceding environment
        id: source
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          case "$TARGET_ENVIRONMENT" in
            dev) source_environment=sandbox ;;
            test) source_environment=dev ;;
            uat) source_environment=test ;;
            *) echo "::error::Only dev, test and uat can be promoted"; exit 1 ;;
          esac
          echo "environment=$source_environment" >> "$GITHUB_OUTPUT"

      - name: configure aws credentials (artefact manifest)
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          aws-region: eu-west-2
          role-to-assume: ${{ secrets.ARTEFACT_STORE_ROLE_ARN }}
          role-session-name: abods-promote-manifest
          role-skip-session-tagging: true

      - name: read deployed source backend
        id: backend-manifest
        uses: department-for-transport-BODS/.github/actions/read-artefact-manifest@v1
        with:
          table: bods-artefact-manifest
          service_artefact: abods-backend
          environment: ${{ steps.source.outputs.environment }}
          region: eu-west-2

      - name: read deployed source frontend
        id: frontend-manifest
        uses: department-for-transport-BODS/.github/actions/read-artefact-manifest@v1
        with:
          table: bods-artefact-manifest
          service_artefact: abods-frontend
          environment: ${{ steps.source.outputs.environment }}
          region: eu-west-2

      - name: validate deployed source artefacts
        id: manifest
        env:
          SOURCE_ENVIRONMENT: ${{ steps.source.outputs.environment }}
          BACKEND_ARTEFACT: ${{ steps.backend-manifest.outputs.version }}
          FRONTEND_ARTEFACT: ${{ steps.frontend-manifest.outputs.version }}
        run: |
          set -euo pipefail
          for component in backend frontend; do
            artefact="$BACKEND_ARTEFACT"
            if [[ "$component" == frontend ]]; then
              artefact="$FRONTEND_ARTEFACT"
            fi
            if [[ ! "$artefact" =~ ^abods_${component}_(sandbox|dev|test|uat)_(v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "::error::Invalid $component artefact in the $SOURCE_ENVIRONMENT manifest"
              exit 1
            fi
            version="${BASH_REMATCH[2]}"
            if [[ "$component" == backend ]]; then
              backend_version="$version"
            elif [[ "$version" != "$backend_version" ]]; then
              echo "::error::Source backend and frontend versions do not match"
              exit 1
            fi
            echo "$component=$artefact" >> "$GITHUB_OUTPUT"
          done

  deploy:
    needs: resolve
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-artefacts.yml
    with:
      backend_artefact: ${{ needs.resolve.outputs.backend_artefact }}
      frontend_artefact: ${{ needs.resolve.outputs.frontend_artefact }}
      is_promotion: true
      environment: ${{ inputs.environment }}
    secrets:
      ARTEFACT_STORE_ROLE_ARN: ${{ secrets.ARTEFACT_STORE_ROLE_ARN }}
      MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
      ANALYTICS_ID: ${{ secrets.ANALYTICS_ID }}