name: cleanup branches
on:
  schedule:
    - cron: "0 0 * * *"
permissions: read-all

jobs:
  remove-stale-branches:
    name: remove stale branches
    runs-on: ubuntu-latest
    permissions:
      # https://github.com/fpicalausa/remove-stale-branches/issues/25#issuecomment-2739147694
      contents: write
      actions: read
      pull-requests: read
    steps:
      - uses: fpicalausa/remove-stale-branches@v2.2.0
        with:
          dry-run: false
          days-before-branch-stale: 60
          exempt-branches-regex: ^(sandbox|dev|test|main)$
          exempt-protected-branches: true
          operations-per-run: 100
          ignore-branches-with-open-prs: true
